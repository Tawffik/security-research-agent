<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<title>SRA Control</title>
<style>
:root { --bg:#0f1419; --card:#1a2332; --fg:#e7ecf3; --muted:#8b9bb4; --acc:#3d8bfd; --ok:#3dd68c; --bad:#ff6b6b; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); }
header { padding:12px 16px; background:#121a24; border-bottom:1px solid #243044; position:sticky; top:0; z-index:2; }
h1 { font-size:1.1rem; margin:0; }
.muted { color:var(--muted); font-size:0.85rem; }
.card { background:var(--card); margin:12px; padding:14px; border-radius:12px; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
button { flex:1; min-width:72px; padding:12px 10px; border:0; border-radius:10px; background:var(--acc); color:#fff; font-weight:600; }
button.secondary { background:#2a3548; }
button.danger { background:#a33; }
button:disabled { opacity:0.4; }
.badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.75rem; background:#2a3548; }
.badge.RUNNING { background:#1d4f91; }
.badge.COMPLETED { background:#1f6b4a; }
.badge.FAILED,.badge.CANCELLED { background:#7a2e2e; }
.badge.BLOCKED { background:#7a5b1e; }
.badge.ok { background:#1f6b4a; }
.badge.bad { background:#7a2e2e; }
.list div { padding:10px 0; border-bottom:1px solid #243044; }
.events { max-height:280px; overflow:auto; font-size:0.8rem; }
.ev { padding:6px 0; border-bottom:1px solid #1e2a3c; }
.ev .t { color:var(--muted); }
.hidden { display:none; }
.err { color:var(--bad); font-size:0.85rem; }
.okmsg { color:var(--ok); font-size:0.85rem; }
</style>
</head>
<body>
<header>
  <h1>Security Research Agent</h1>
  <div class="muted">Phone = control · Research runs remotely · Live HTTP off by default</div>
</header>

<section class="card">
  <div id="authState" class="muted">Connecting…</div>
  <div id="healthOut" class="muted" style="margin-top:8px"></div>
  <div id="authErr" class="err"></div>
  <div id="authOk" class="okmsg"></div>
  <div class="row" style="margin-top:10px">
    <button class="secondary" id="btnHealth" type="button">Health</button>
    <button class="secondary" id="btnReconnect" type="button">Reconnect</button>
  </div>
</section>

<section class="card">
  <label class="muted" style="display:block;margin-bottom:6px">Recon artifact (from BBCI export or fixtures — read only)</label>
  <select id="artifactSelect" style="width:100%;padding:10px;border-radius:8px;border:1px solid #2c3b52;background:#0f1419;color:#e7ecf3;margin-bottom:10px">
    <option value="">Loading artifacts…</option>
  </select>
  <div class="row">
    <button id="btnCreate" type="button">New session</button>
    <button class="secondary" id="btnRefresh" type="button">Refresh</button>
  </div>
  <div id="sessions" class="list" style="margin-top:10px"></div>
</section>

<section class="card hidden" id="sessionCard">
  <div><strong id="sid"></strong> <span id="sstatus" class="badge"></span></div>
  <div class="muted" id="sphase"></div>
  <div class="muted" id="smeta"></div>
  <div class="row" style="margin-top:10px">
    <button id="btnStart" type="button">Start</button>
    <button class="secondary" id="btnPause" type="button">Pause</button>
    <button class="secondary" id="btnResume" type="button">Resume</button>
    <button class="danger" id="btnStop" type="button">Stop</button>
  </div>
  <h3 style="font-size:0.95rem">Events</h3>
  <div id="events" class="events"></div>
  <h3 style="font-size:0.95rem">Report</h3>
  <pre id="report" class="muted" style="white-space:pre-wrap;font-size:0.8rem"></pre>
</section>

<script>
/* mobile-auth-v3 bbci-artifact-v1: HttpOnly session cookie — no long-lived server secret in JS or browser storage */
const $ = (id) => document.getElementById(id);
let currentId = null;
let pollTimer = null;
let ready = false;

async function api(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (opts.headers) {
    for (var k in opts.headers) headers[k] = opts.headers[k];
  }
  var r = await fetch(path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body,
    credentials: 'same-origin',
    cache: 'no-store'
  });
  var text = await r.text();
  var data;
  try { data = JSON.parse(text); } catch (e) { data = { raw: text }; }
  if (!r.ok) {
    var detail = data.detail || data.error || r.statusText || String(r.status);
    if (typeof detail !== 'string') detail = JSON.stringify(detail);
    throw new Error(detail);
  }
  return data;
}

async function ensureSession() {
  $('authErr').textContent = '';
  $('authOk').textContent = '';
  // GET / already sets cookie; bootstrap is belt-and-suspenders
  try {
    await fetch('/', { credentials: 'same-origin', cache: 'no-store' });
  } catch (e) {}
  try {
    await api('/api/auth/bootstrap', { method: 'POST', body: '{}' });
  } catch (e) {
    // may already be authenticated via cookie from GET /
  }
  var st = await api('/api/auth/session');
  if (!st.authenticated) {
    ready = false;
    $('authState').innerHTML = 'Auth: <span class="badge bad">not authenticated</span>';
    $('authErr').textContent = 'Control session not established. Restart the remote Control Plane, then tap Reconnect.';
    return false;
  }
  ready = true;
  $('authState').innerHTML = 'Auth: <span class="badge ok">session active</span>';
  $('authOk').textContent = 'Ready — no API token required on the phone';
  return true;
}

$('btnHealth').onclick = async function () {
  try {
    var h = await fetch('/health', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { return r.json(); });
    $('healthOut').textContent = JSON.stringify({
      agent: h.agent, auth_configured: h.auth_configured,
      browser_session: h.browser_session, live_http_default: h.live_http_default
    });
  } catch (e) {
    $('healthOut').textContent = String(e);
  }
};

$('btnReconnect').onclick = async function () {
  if (await ensureSession()) await refresh();
};

async function refresh() {
  $('authErr').textContent = '';
  if (!ready && !(await ensureSession())) return;
  try {
    var data = await api('/api/sessions');
    var el = $('sessions');
    el.innerHTML = '';
    (data.sessions || []).forEach(function (s) {
      var d = document.createElement('div');
      d.innerHTML = '<span class="badge ' + s.status + '">' + s.status + '</span> ' + s.session_id +
        '<br/><span class="muted">' + s.label + ' · ' + s.current_phase + '</span>';
      d.onclick = function () { openSession(s.session_id); };
      el.appendChild(d);
    });
    $('authOk').textContent = 'Sessions loaded';
  } catch (e) {
    ready = false;
    $('authErr').textContent = String(e.message || e);
  }
}

$('btnRefresh').onclick = function () { refresh(); };
$('btnCreate').onclick = async function () {
  if (!ready && !(await ensureSession())) return;
  try {
    var sel = $('artifactSelect');
    var path = sel.value || '';
    var scope = '';
    if (sel.selectedOptions && sel.selectedOptions[0]) {
      scope = sel.selectedOptions[0].dataset.scope || '';
    }
    var body = { label: 'mobile-session' };
    if (path) body.recon_path = path;
    if (scope) body.scope_path = scope;
    var s = await api('/api/sessions', {
      method: 'POST',
      body: JSON.stringify(body)
    });
    await openSession(s.session_id);
    await refresh();
  } catch (e) {
    $('authErr').textContent = String(e.message || e);
  }
};

async function openSession(id) {
  currentId = id;
  $('sessionCard').classList.remove('hidden');
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function () { loadSession(id); }, 1000);
  await loadSession(id);
}

async function loadSession(id) {
  try {
    var s = await api('/api/sessions/' + id);
    $('sid').textContent = s.session_id;
    $('sstatus').textContent = s.status;
    $('sstatus').className = 'badge ' + s.status;
    $('sphase').textContent = 'Phase: ' + (s.current_phase || '-') + ' · hyp: ' + (s.current_hypothesis || '-') + ' · exp: ' + (s.current_experiment || '-');
    $('smeta').textContent = 'Evidence: ' + s.evidence_count + ' · finding: ' + (s.latest_finding || 'none') + ' · live_http: false';
    var ev = await api('/api/sessions/' + id + '/events');
    var box = $('events');
    box.innerHTML = '';
    (ev.events || []).forEach(function (e) {
      var d = document.createElement('div');
      d.className = 'ev';
      d.innerHTML = '<span class="t">#' + e.sequence + '</span> <strong>' + e.event_type + '</strong> ' + (e.message || '');
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
    var rep = await api('/api/sessions/' + id + '/report');
    $('report').textContent = JSON.stringify(rep, null, 2);
    var running = s.status === 'RUNNING';
    var readySt = s.status === 'READY' || s.status === 'PAUSED' || s.status === 'CREATED';
    $('btnStart').disabled = !readySt;
    $('btnPause').disabled = !running;
    $('btnResume').disabled = s.status !== 'PAUSED';
    $('btnStop').disabled = ['COMPLETED','FAILED','CANCELLED','BLOCKED','INCONCLUSIVE'].indexOf(s.status) >= 0;
  } catch (e) {
    $('authErr').textContent = String(e.message || e);
  }
}

async function mut(op) {
  if (!currentId) return;
  if (op === 'stop' && !confirm('Stop this session?')) return;
  try {
    await api('/api/sessions/' + currentId + '/' + op, { method: 'POST', body: '{}' });
    await loadSession(currentId);
    await refresh();
  } catch (e) {
    alert(e.message || e);
  }
}
$('btnStart').onclick = function () { mut('start'); };
$('btnPause').onclick = function () { mut('pause'); };
$('btnResume').onclick = function () { mut('resume'); };
$('btnStop').onclick = function () { mut('stop'); };

async function loadArtifacts() {
  try {
    var data = await api('/api/artifacts');
    var sel = $('artifactSelect');
    sel.innerHTML = '';
    (data.artifacts || []).forEach(function (a) {
      var opt = document.createElement('option');
      opt.value = a.path;
      opt.textContent = a.label;
      opt.dataset.scope = a.scope_hint || '';
      opt.dataset.kind = a.kind || '';
      sel.appendChild(opt);
    });
    if (!sel.options.length) {
      var o = document.createElement('option');
      o.value = '';
      o.textContent = 'No artifacts found';
      sel.appendChild(o);
    }
  } catch (e) {
    $('authErr').textContent = 'Artifacts: ' + (e.message || e);
  }
}

(async function boot() {
  if (await ensureSession()) {
    await loadArtifacts();
    await refresh();
  }
})();
</script>
</body>
</html>
